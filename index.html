<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The font stylesheet is loaded non-render-blocking. As a plain
         stylesheet link it cost 996ms of first paint on Lighthouse mobile;
         preconnect already warms both origins, and display=swap means text
         paints immediately in the fallback and swaps when the file lands.
         The noscript copy covers JS being unavailable. -->
    <!-- Preload the same URL at high priority first. A media="print"
         stylesheet on its own is fetched at very low priority, so the Archivo
         900 that the hero LCP element needs arrived after first paint and
         pushed LCP to 2.7s against a 1.2s FCP. The preload response is reused
         by the stylesheet link below, so this costs no extra request. -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;900&family=Spectral:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" as="style" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;900&family=Spectral:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" media="print" onload="this.media='all'; this.onload=null" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;900&family=Spectral:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" /></noscript>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Abhikrishna - Designer and Developer crafting digital products that solve problems and look beautiful." />
    <meta name="author" content="Abhikrishna" />
    <meta property="og:title" content="Abhikrishna | Portfolio" />
    <meta property="og:description" content="Designer and Developer crafting digital products that solve problems and look beautiful." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Abhikrishna | Portfolio</title>
  </head>

    <!-- SEED: THESIS — The portfolio is an engineer's working field logbook; the site itself is the artifact, dated stamped entries and ruled measurement tables proving craft from the database to the pixel, refusing the dark name-hero rut and the resume-as-site. OWN-WORLD — Aged ledger paper ground with a faint engineering grid, a red margin rule and punched holes; ink-blue primary, stamp-red corrections; body in a clean grotesque, data in mono, display set as heavy stamped uppercase; double-ruled ledger heads, tape, corner marks, and rubber stamps. STORY — A recruiter opens the log and reads skills, builds, and contact like signed measured entries; the ink is dry, the verdict their own, contact one glance away. FIRST VIEWPORT — An open logbook sheet: stamped owner header row, heavy stamped name, one-line subtitle, availability stamp, a ruled measurements row (20+ projects / 100+ problems / 1 goal), and stamped actions toward the builds, with a margin note pointing in. FORM — The Engineering Field Logbook, grounded candidate 5 of 7; seed key 3fc37d6d. FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md. -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
